app.name=@project.name@
app.version=@project.version@
spring.application.name=OPEN-MERCH
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# LOGGING
logging.file.path=c:\\develop\\merchmaster\\log
logging.level.root=WARN
logging.level.eu.zavadil=TRACE
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.jdbc.core.JdbcTemplate=ERROR
# DEV
spring.devtools.restart.enabled=false
# REST API
server.port=8089
server.allowedOrigin=http://localhost:8089
api.base-url=/api
springdoc.swagger-ui.path=/apidocs.html
server.error.include-message=always
# OAUTH
oauth.header-name=Authorization
oauth.audience-name=OPEN-MERCH
oauth.access.expires-after=24h
oauth.rsa-key-path=c:\\develop\\openmerch\\rsa-store\\rsa.json
oauth.admin.email=
oauth.admin.password=
# DB
spring.datasource.url=jdbc:postgresql://localhost:5439/om
spring.datasource.username=om
spring.datasource.password=om
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.hbm2ddl.drop=false
spring.jpa.open-in-view=true
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
# FLYWAY MIGRATIONS
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Imagez
imagez.baseUrl=http://localhost:8080
imagez.secretToken=
# Emails
emails.sender=no-reply@openmerch.eu
emails.host=smtp.websupport.cz
emails.port=465
emails.username=publikace@zavadil.eu
emails.password=
